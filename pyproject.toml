[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logihub-dashboard"
version = "1.1.0"
description = "Аналитический дашборд OTIF и финансовых показателей платформы ЛогиХаб"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Popov A.S." }]
dependencies = ["dash>=2.17,<4", "dash-bootstrap-components>=1.6", "pandas>=2.2", "plotly>=5.22"]

[project.urls]
Homepage = "https://github.com/starpxand/logihub-dashboard"

[tool.setuptools]
packages = ["logihub_dashboard"]
